name: Probar CORS (temporal)
on:
  push:
    branches: [claude/project-thread-kh81ly]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://api.rlshopnotify.com/api/items/4962" "https://itemshop.gg/rocket-league/catalogue" "https://rl.source.gs/items/wheels/index.json" "https://fortnite-api.com/v2/shop"; do
            echo "== $u"; curl -s -o /dev/null -D - -H "Origin: https://gio-glitch04.github.io" "$u" | grep -i -E "^(HTTP|access-control|content-length|content-encoding)" ; done
